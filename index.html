<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nutricionista</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; color: #666; font-size: 14px; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 16px; }
        button { width: 100%; padding: 12px; background-color: #2980b9; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { background-color: #2471a3; }
        #mensagem { margin-top: 15px; text-align: center; font-size: 14px; color: #e74c3c; }
        .links-uteis { margin-top: 20px; text-align: center; font-size: 14px; }
        .links-uteis a { color: #2980b9; text-decoration: none; }
        .links-uteis a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Entrar no Sistema</h2>
        <form id="form-login">
            <div class="input-group">
                <label for="email">E-mail Profissional</label>
                <input type="email" id="email" required placeholder="Digite seu e-mail">
            </div>
            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required placeholder="Digite sua senha">
            </div>
            <button type="submit" id="btn-entrar">Entrar</button>
        </form>
        <div id="mensagem"></div>
        
        <div class="links-uteis">
            <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se aqui</a></p>
        </div>
    </div>

    <script type="module">
        // Importa a biblioteca do Supabase
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        // Credenciais do seu projeto Supabase
        const supabaseUrl = 'https://gytbotbtdbgemucmybtm.supabase.co';
        const supabaseKey = 'sb_publishable_L94mxiPRpFIbejpmJdeCiA_RUyxUGlh';
        const supabase = createClient(supabaseUrl, supabaseKey);

        const form = document.getElementById('form-login');
        const mensagem = document.getElementById('mensagem');
        const btn = document.getElementById('btn-entrar');

        form.addEventListener('submit', async (e) => {
            e.preventDefault(); 
            
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            btn.innerText = "Entrando...";
            btn.disabled = true;
            mensagem.innerText = ""; // Limpa mensagens anteriores

            // Tenta fazer o login com o Supabase
            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: senha
            });

            if (error) {
                // Se der erro (ex: senha errada, usuário não existe)
                mensagem.innerText = "Erro ao entrar: E-mail ou senha incorretos.";
                btn.innerText = "Entrar";
                btn.disabled = false;
                return;
            }

            // Se der certo, redireciona para o painel
            mensagem.style.color = "#27ae60";
            mensagem.innerText = "Login realizado com sucesso! Redirecionando...";
            
            setTimeout(() => {
                window.location.href = 'dashboard.html'; 
            }, 1000);
        });
    </script>

</body>
</html>
