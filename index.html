<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NutriSystem</title>
    <!-- Fonte moderna Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { 
            background: linear-gradient(135deg, #f4f7f6 0%, #e0eaf5 100%); 
            display: flex; justify-content: center; align-items: center; min-height: 100vh; 
        }
        
        /* O "Card" com cara de plataforma premium */
        .card { 
            background: #ffffff; 
            padding: 40px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); 
            width: 100%; 
            max-width: 420px; 
            border: 1px solid #f0f0f0;
        }
        
        h2 { text-align: center; color: #1e293b; margin-bottom: 25px; font-weight: 600; }
        
        .input-group { margin-bottom: 20px; position: relative; }
        .input-group label { display: block; margin-bottom: 8px; color: #475569; font-size: 14px; font-weight: 500;}
        
        /* Inputs modernos e interativos */
        .input-group input:not([type="checkbox"]) { 
            width: 100%; 
            padding: 12px 16px; 
            border: 2px solid #e2e8f0; 
            border-radius: 8px; 
            font-size: 15px; 
            color: #334155;
            transition: all 0.3s ease; 
            background-color: #f8fafc;
        }
        .input-group input:focus { 
            border-color: #3b82f6; 
            background-color: #ffffff; 
            outline: none; 
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        /* Botão do Olhinho da Senha */
        .btn-ver-senha {
            position: absolute;
            right: 12px;
            top: 38px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            color: #94a3b8;
            transition: 0.2s;
        }
        .btn-ver-senha:hover { color: #475569; }

        /* Checkbox "Lembrar senha" */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 25px;
            font-size: 14px;
            color: #64748b;
        }
        .checkbox-group input { cursor: pointer; width: 16px; height: 16px; accent-color: #3b82f6; }

        /* Botão de Entrar */
        button[type="submit"] { 
            width: 100%; 
            padding: 14px; 
            background-color: #3b82f6; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: 600;
            cursor: pointer; 
            transition: all 0.3s; 
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }
        button[type="submit"]:hover { 
            background-color: #2563eb; 
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.3);
        }

        #mensagem { margin-top: 20px; text-align: center; font-size: 14px; font-weight: 500; min-height: 20px;}
        
        .links-uteis { margin-top: 25px; text-align: center; font-size: 14px; color: #64748b; }
        .links-uteis a { color: #3b82f6; text-decoration: none; font-weight: 600; transition: 0.2s;}
        .links-uteis a:hover { color: #1d4ed8; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Entrar no Sistema</h2>
        <form id="form-login">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="Digite seu e-mail">
            </div>
            
            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required placeholder="Digite sua senha">
                <button type="button" class="btn-ver-senha" id="toggle-senha" title="Mostrar/Ocultar Senha">👁️</button>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="lembrar-senha">
                <label for="lembrar-senha">Lembrar meu e-mail</label>
            </div>

            <button type="submit" id="btn-entrar">Entrar</button>
        </form>
        <div id="mensagem"></div>
        
        <div class="links-uteis">
            <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se aqui</a></p>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const supabaseUrl = 'https://gytbotbtdbgemucmybtm.supabase.co';
        const supabaseKey = 'sb_publishable_L94mxiPRpFIbejpmJdeCiA_RUyxUGlh'; 
        const supabase = createClient(supabaseUrl, supabaseKey);

        const form = document.getElementById('form-login');
        const mensagem = document.getElementById('mensagem');
        const btn = document.getElementById('btn-entrar');
        const inputEmail = document.getElementById('email');
        const checkboxLembrar = document.getElementById('lembrar-senha');
        const btnToggleSenha = document.getElementById('toggle-senha');
        const inputSenha = document.getElementById('senha');

        // ==== Lógica de "Lembrar meu e-mail" ao carregar a página ====
        window.onload = () => {
            const emailSalvo = localStorage.getItem('nutrisystem_saved_email');
            if (emailSalvo) {
                inputEmail.value = emailSalvo;
                checkboxLembrar.checked = true;
            }
        };

        // ==== Lógica do Olhinho de Senha ====
        btnToggleSenha.addEventListener('click', () => {
            if (inputSenha.type === 'password') {
                inputSenha.type = 'text';
                btnToggleSenha.innerText = '🙈';
            } else {
                inputSenha.type = 'password';
                btnToggleSenha.innerText = '👁️';
            }
        });

        // ==== Lógica de Login com Redirecionamento Dinâmico por Perfil ====
        form.addEventListener('submit', async (e) => {
            e.preventDefault(); 
            
            const email = inputEmail.value;
            const senha = inputSenha.value;

            btn.innerText = "Entrando...";
            btn.disabled = true;
            mensagem.innerText = "";

            if (checkboxLembrar.checked) {
                localStorage.setItem('nutrisystem_saved_email', email);
            } else {
                localStorage.removeItem('nutrisystem_saved_email');
            }

            // 1. Tenta autenticar no Supabase Auth
            const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
                email: email,
                password: senha
            });

            if (authError) {
                mensagem.style.color = "#e74c3c";
                mensagem.innerText = "Erro ao entrar: E-mail ou senha incorretos.";
                btn.innerText = "Entrar";
                btn.disabled = false;
                return;
            }

            const userId = authData.user.id;

            // 2. Consulta a tabela 'perfis' para verificar se é nutricionista ou paciente
            const { data: perfilData, error: perfilError } = await supabase
                .from('perfis')
                .select('papel')
                .eq('id', userId)
                .single();

            if (perfilError || !perfilData) {
                mensagem.style.color = "#e74c3c";
                mensagem.innerText = "Erro ao identificar o perfil do usuário no sistema.";
                btn.innerText = "Entrar";
                btn.disabled = false;
                return;
            }

            mensagem.style.color = "#27ae60";
            mensagem.innerText = "Login realizado com sucesso! Redirecionando...";
            
            // 3. Redirecionamento baseado no cargo registrado no banco
            setTimeout(() => {
                if (perfilData.papel === 'nutricionista') {
                    window.location.href = 'pacientes.html'; 
                } else if (perfilData.papel === 'paciente') {
                    window.location.href = 'dashboard_paciente.html'; 
                } else {
                    window.location.href = 'dashboard.html'; 
                }
            }, 1000);
        });
    </script>

</body>
</html>
