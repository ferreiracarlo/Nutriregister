<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Nutricionista - NutriSystem</title>
    <!-- Fonte moderna Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { 
            background-color: #f8fafc; /* Fundo cinza bem claro/azulado */
            display: flex; 
            height: 100vh; 
            overflow: hidden;
        }
        
        /* Menu Lateral (Sidebar) Premium */
        .sidebar { 
            width: 260px; 
            background-color: #1e293b; /* Azul ardósia escuro */
            color: white; 
            padding: 30px 20px; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 4px 0 15px rgba(0,0,0,0.05);
            z-index: 10;
        }
        .sidebar h2 { 
            font-size: 22px; 
            margin-bottom: 40px; 
            text-align: center; 
            color: #27ae60; /* Verde destaque */
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        
        /* Itens do Menu */
        .menu-item { 
            padding: 14px 16px; 
            margin-bottom: 8px; 
            background-color: transparent; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            color: #cbd5e1; 
            text-decoration: none; 
            display: flex;
            align-items: center;
            font-size: 15px;
            font-weight: 500;
        }
        .menu-item:hover { 
            background-color: #334155; 
            color: #ffffff; 
            transform: translateX(4px); /* Efeito suave de deslizar para a direita */
        }
        .menu-item.active {
            background-color: #27ae60;
            color: white;
            box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3);
        }
        
        /* Botão de Sair */
        .logout-btn { 
            margin-top: auto; 
            padding: 14px; 
            background-color: rgba(231, 76, 60, 0.1); /* Fundo vermelho translúcido */
            color: #e74c3c; 
            text-align: center; 
            border-radius: 8px; 
            cursor: pointer; 
            border: 1px solid rgba(231, 76, 60, 0.2); 
            font-size: 15px; 
            font-weight: 600;
            transition: all 0.3s ease; 
        }
        .logout-btn:hover { 
            background-color: #e74c3c; 
            color: white; 
        }

        /* Área Principal */
        .main-content { 
            flex: 1; 
            padding: 40px; 
            overflow-y: auto; 
        }
        
        /* Cabeçalho */
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 35px; 
            background: #ffffff; 
            padding: 24px 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); 
            border: 1px solid #f1f5f9;
        }
        .header h1 { 
            color: #1e293b; 
            font-size: 24px; 
            font-weight: 600;
        }
        .user-avatar {
            width: 45px;
            height: 45px;
            background-color: #27ae60;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3);
        }
        
        /* Grid de Cartões de Resumo */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: #ffffff; 
            padding: 24px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid #f1f5f9;
            transition: transform 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
        }
        .stat-card h3 { color: #64748b; font-size: 14px; font-weight: 500; margin-bottom: 10px; }
        .stat-card .value { color: #1e293b; font-size: 32px; font-weight: 700; }
        
        /* Tela de Loading Elegante */
        #loading { 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            position: fixed; 
            top: 0; left: 0; width: 100vw; height: 100vh; 
            background: linear-gradient(135deg, #f4f7f6 0%, #e0eaf5 100%); 
            z-index: 1000; 
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(39, 174, 96, 0.2);
            border-left-color: #27ae60;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        .loading-text { font-size: 18px; color: #475569; font-weight: 500; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* App Content */
        #app-content { display: none; width: 100%; height: 100vh; }
    </style>
</head>
<body>

    <!-- Tela de Carregamento -->
    <div id="loading">
        <div class="spinner"></div>
        <div class="loading-text">Autenticando...</div>
    </div>

    <!-- Conteúdo do Painel -->
    <div id="app-content">
        
        <!-- Menu Lateral -->
        <div class="sidebar">
            <h2>NutriSystem</h2>
            <a href="#" class="menu-item active">🏠 Início</a>
            <a href="#" class="menu-item">👥 Meus Pacientes</a>
            <a href="#" class="menu-item">📅 Agenda</a>
            <a href="#" class="menu-item">🍏 Cardápios</a>
            
            <button class="logout-btn" id="btn-sair">Sair do Sistema</button>
        </div>

        <!-- Área Central -->
        <div class="main-content">
            
            <!-- Cabeçalho com o nome puxado do banco -->
            <div class="header">
                <h1 id="boas-vindas">Carregando...</h1>
                <div class="user-avatar" id="avatar-letra">N</div>
            </div>
            
            <!-- Grid de Estatísticas (Cards) -->
            <div class="dashboard-grid">
                <div class="stat-card">
                    <h3>Pacientes Ativos</h3>
                    <div class="value">0</div>
                </div>
                <div class="stat-card">
                    <h3>Consultas Hoje</h3>
                    <div class="value">0</div>
                </div>
                <div class="stat-card">
                    <h3>Planos Alimentares</h3>
                    <div class="value">0</div>
                </div>
            </div>

            <!-- Área livre para tabelas e formulários futuros -->
            <div style="background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid #f1f5f9;">
                <h3 style="color: #1e293b; margin-bottom: 15px; font-weight: 600;">Próximas Consultas</h3>
                <p style="color: #64748b; font-size: 15px;">Você ainda não tem pacientes cadastrados. Navegue até "Meus Pacientes" para começar.</p>
            </div>

        </div>
    </div>

    <!-- Script de Autenticação Supabase -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const supabaseUrl = 'https://gytbotbtdbgemucmybtm.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5dGJvdGJ0ZGJnZW11Y215YnRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1OTQ5NjQsImV4cCI6MjEwMzE3MDk2NH0.OBwe0b3XpPsoIOkP5HM46HBR0rziGqcMjw1AYrmaw0E';
        const supabase = createClient(supabaseUrl, supabaseKey);

        async function verificarAcesso() {
            const { data: { session }, error: sessionError } = await supabase.auth.getSession();

            if (!session) {
                window.location.href = 'login.html'; 
                return;
            }

            const userId = session.user.id;
            
            const { data: perfil, error: perfilError } = await supabase
                .from('perfis')
                .select('*')
                .eq('id', userId)
                .single();

            if (perfilError || !perfil) {
                alert("Erro ao carregar o perfil.");
                return;
            }

            if (perfil.papel !== 'nutricionista') {
                alert("Acesso negado. Apenas nutricionistas podem acessar esta área.");
                await supabase.auth.signOut();
                window.location.href = 'cadastro.html';
                return;
            }

            // Interface atualizada com os dados do usuário
            document.getElementById('boas-vindas').innerText = `Olá, ${perfil.nome}!`;
            document.getElementById('avatar-letra').innerText = perfil.nome.charAt(0).toUpperCase(); // Pega a primeira letra do nome
            
            // Oculta loading e mostra o painel
            document.getElementById('loading').style.display = 'none';
            document.getElementById('app-content').style.display = 'flex';
        }

        document.getElementById('btn-sair').addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.href = 'login.html'; 
        });

        verificarAcesso();
    </script>

</body>
</html>
